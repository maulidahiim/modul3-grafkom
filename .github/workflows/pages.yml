# Lab 3.4 -- publish web/ to GitHub Pages, and prove the clean-clone build is green.
# Repo settings -> Pages -> Source: "GitHub Actions".
# If Module3 is NOT the repo root (e.g. code/Module3), set MODULE_DIR below and
# move this file to <repo root>/.github/workflows/.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  MODULE_DIR: .
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install
        working-directory: ${{ env.MODULE_DIR }}
        run: python -m pip install -r requirements.txt
      - name: make_model + tests (must be green)
        working-directory: ${{ env.MODULE_DIR }}
        run: |
          python make_model.py
          python tests.py
      - name: package the model for the viewer
        working-directory: ${{ env.MODULE_DIR }}
        run: python build_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.MODULE_DIR }}/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
